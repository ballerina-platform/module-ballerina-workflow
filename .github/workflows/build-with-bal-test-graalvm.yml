name: GraalVM Check

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - v2

jobs:
  call_workflow:
    name: Run GraalVM Check
    if: ${{ github.repository_owner == 'ballerina-platform' }}
    uses: ballerina-platform/ballerina-library/.github/workflows/build-with-bal-test-graalvm-template.yml@main
    with:
      additional_ubuntu_build_flags: "-x :workflow-integration-tests:test -x :workflow-examples:test"
      additional_windows_build_flags: "-x test"
