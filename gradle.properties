# swagger-core runtime shim for compiler-plugin tests: the ballerina/ai compiler extension's
# ballerina-to-openapi schema generation expects it from the bal CLI distribution. Keep in
# step with the OpenAPI tooling of the distribution under test (2201.13.x).
swaggerCoreVersion=2.2.19
swaggerParserVersion=2.1.22

# Temporal and Related Dependencies
temporalSdkVersion=1.32.0
# Temporal CLI version
temporalCliVersion=1.6.0
jacksonVersion=2.18.11
# gRPC override: Temporal SDK 1.32.0 BOM pins grpc at 1.58.1, but we use
# a newer release for bug fixes. All grpc-* dependencies in native/build.gradle
# are declared explicitly at grpcVersion so Gradle's conflict resolution upgrades
# the BOM-pinned artifacts consistently.
# JDK 24+ sun.misc.Unsafe warnings: grpc >= 1.83.0 (shaded Netty 4.2) and protobuf >= 4.36.0 are the first clean ones.
grpcVersion=1.84.1
protobufVersion=4.36.2
protoGoogleCommonProtosVersion=2.64.1
guavaVersion=33.6.0-jre
tallyVersion=0.13.0
perfmarkVersion=0.27.0
nexusrpcVersion=0.4.0-alpha

# Metrics reporter used by the observability integration tests
prometheusVersion=1.0.1
